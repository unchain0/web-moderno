name: ci
on:
  push:
    branches: [main, master]
  pull_request:
    paths-ignore:
      - 'docs/assets/**'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx eslint .
      - run: node scripts/check-rng.js
