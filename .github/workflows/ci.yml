name: ci
on:
  push:
    branches: [main, master]
  pull_request:
    paths-ignore:
      - 'docs/assets/**'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af8b # v4.2.2
      - run: npm ci
      - run: npx eslint .
